<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Snake</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
			font-synthesis: none;
			--surface: #0b100c;
			--surface-raised: #0e150f;
			--line: #304032;
			--text: #c4d9c2;
			--muted: #829681;
			--accent: #a8e6a0;
		}
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 36px 24px; background: var(--surface); color: var(--text); }
		main { width: min(100%, 1080px); }
		.game-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
		.eyebrow { margin: 0 0 5px; color: var(--muted); font-size: .75rem; text-transform: uppercase; }
		h1 { margin: 0; color: var(--accent); font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 700; line-height: 1.2; text-transform: uppercase; }
		.game-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(245px, .75fr); gap: 16px; align-items: stretch; }
		.board-panel, .game-sidebar { border: 1px solid var(--line); background: var(--surface-raised); }
		.board-panel { padding: 16px; }
		.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 12px; color: var(--muted); font-size: .85rem; }
		.score { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
		canvas { display: block; width: 100%; aspect-ratio: 1; background: #080d09; border: 1px solid var(--line); image-rendering: pixelated; touch-action: none; }
		.game-sidebar { display: flex; flex-direction: column; padding: 20px; }
		.sidebar-heading { margin: 0 0 10px; color: var(--accent); font-size: 1rem; font-weight: 700; text-transform: uppercase; }
		.hint { margin: 0; color: var(--muted); font-size: .85rem; line-height: 1.65; }
		.controls { display: flex; gap: 8px; margin-top: 20px; }
		button { min-height: 42px; border: 1px solid #405442; border-radius: 0; padding: 9px 14px; background: #121b13; color: var(--text); font: inherit; font-size: .82rem; cursor: pointer; }
		button:hover:not(:disabled) { border-color: var(--accent); background: #18251a; }
		button:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
		button:disabled { opacity: .48; cursor: not-allowed; }
		#start { flex: 1; border-color: var(--accent); background: var(--accent); color: #0b100c; }
		#start:hover:not(:disabled) { background: #c0efb8; }
		#layout-toggle { flex: 0 0 auto; }
		.pad { display: none; grid-template-columns: repeat(3, minmax(52px, 1fr)); grid-template-rows: repeat(2, 48px); gap: 8px; margin-top: 20px; }
		.pad button { padding: 4px; font-size: 1rem; touch-action: manipulation; }
		.pad .up { grid-column: 2; }
		.pad .left { grid-column: 1; grid-row: 2; }
		.pad .down { grid-column: 2; grid-row: 2; }
		.pad .right { grid-column: 3; grid-row: 2; }
		.game-layout.mobile-layout { grid-template-columns: minmax(0, 560px); justify-content: center; }
		.mobile-layout .game-sidebar { padding: 20px; }
		.mobile-layout .pad { display: grid; }
		@media (max-width: 760px) {
			body { padding: 22px 16px; }
			.game-layout { grid-template-columns: minmax(0, 1fr); }
			.game-sidebar { padding: 20px; }
		}
		@media (max-width: 420px) {
			.game-header { align-items: flex-start; }
			#layout-toggle { max-width: 145px; padding-inline: 10px; font-size: .8rem; }
			.board-panel { padding: 12px; border-radius: 14px; }
			.topbar { font-size: .8rem; }
			.game-sidebar { padding: 18px; }
		}
	</style>
</head>
<body>
	<main>
		<header class="game-header">
			<div><p class="eyebrow">Terminal / game 01</p><h1>Snake</h1></div>
			<button id="layout-toggle" type="button" aria-pressed="false">Use mobile layout</button>
		</header>
		<section class="game-layout" id="game-layout" aria-label="Snake game">
			<div class="board-panel">
				<div class="topbar"><span id="status" role="status" aria-live="polite">Press Start to play</span><span class="score">Score <span id="score">0</span></span></div>
				<canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
			</div>
			<aside class="game-sidebar">
				<h2 class="sidebar-heading">How to play</h2>
				<p class="hint">Use the arrow keys or WASD to move. Collect the blocks and avoid the walls and your tail.</p>
				<div class="controls">
					<button id="start" type="button">Start game</button>
					<button id="pause" type="button" disabled>Pause</button>
				</div>
				<div class="pad" aria-label="Touch controls">
					<button class="up" data-dir="up" aria-label="Up" type="button">▲</button>
					<button class="left" data-dir="left" aria-label="Left" type="button">◀</button>
					<button class="down" data-dir="down" aria-label="Down" type="button">▼</button>
					<button class="right" data-dir="right" aria-label="Right" type="button">▶</button>
				</div>
			</aside>
		</section>
	</main>
	<script>
		(() => {
			const canvas = document.getElementById('board');
			const ctx = canvas.getContext('2d');
			const scoreEl = document.getElementById('score');
			const statusEl = document.getElementById('status');
			const startBtn = document.getElementById('start');
			const pauseBtn = document.getElementById('pause');
			const layoutToggle = document.getElementById('layout-toggle');
			const gameLayout = document.getElementById('game-layout');
			const directions = {
				up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
				left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
			};
			const keyDirections = {
				ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down',
				ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right'
			};
			const cells = 20;
			const size = canvas.width / cells;
			let snake, food, direction, nextDirection, score, timer, running = false, paused = false;

			function reset() {
				snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
				direction = { x: 1, y: 0 };
				nextDirection = { ...direction };
				score = 0;
				scoreEl.textContent = score;
				placeFood();
				draw();
			}

			function placeFood() {
				do {
					food = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
				} while (snake.some(part => part.x === food.x && part.y === food.y));
			}

			function draw() {
				ctx.fillStyle = '#080d09';
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				ctx.fillStyle = '#111a12';
				for (let i = 1; i < cells; i++) {
					ctx.fillRect(i * size - 1, 0, 1, canvas.height);
					ctx.fillRect(0, i * size - 1, canvas.width, 1);
				}
				ctx.fillStyle = '#c9d875';
				ctx.fillRect(food.x * size + 3, food.y * size + 3, size - 6, size - 6);
				snake.forEach((part, index) => {
					ctx.fillStyle = index === 0 ? '#d5f5c2' : '#75bb75';
					ctx.fillRect(part.x * size + 1, part.y * size + 1, size - 2, size - 2);
				});
			}

			function tick() {
				direction = nextDirection;
				const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
				const ate = head.x === food.x && head.y === food.y;
				const collisionLimit = snake.length - (ate ? 0 : 1);
				let collision = false;
				for (let i = 0; i < collisionLimit; i++) {
					if (snake[i].x === head.x && snake[i].y === head.y) {
						collision = true;
						break;
					}
				}
				if (head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells || collision) {
					endGame();
					return;
				}
				snake.unshift(head);
				if (ate) {
					score += 10;
					scoreEl.textContent = score;
					placeFood();
				} else snake.pop();
				draw();
			}

			function endGame() {
				clearInterval(timer);
				running = false;
				paused = false;
				statusEl.textContent = `Game over — score ${score}`;
				startBtn.textContent = 'Play again';
				pauseBtn.disabled = true;
			}

			function startGame() {
				clearInterval(timer);
				reset();
				running = true;
				paused = false;
				statusEl.textContent = 'Good luck!';
				startBtn.textContent = 'Restart game';
				pauseBtn.disabled = false;
				pauseBtn.textContent = 'Pause';
				timer = setInterval(tick, 115);
			}

			function setDirection(name) {
				const candidate = directions[name];
				if (candidate && (candidate.x !== -direction.x || candidate.y !== -direction.y)) nextDirection = candidate;
			}

			startBtn.addEventListener('click', startGame);
			layoutToggle.addEventListener('click', () => {
				const mobileLayout = gameLayout.classList.toggle('mobile-layout');
				layoutToggle.setAttribute('aria-pressed', String(mobileLayout));
				layoutToggle.textContent = mobileLayout ? 'Use desktop layout' : 'Use mobile layout';
			});
			pauseBtn.addEventListener('click', () => {
				if (!running) return;
				paused = !paused;
				if (paused) {
					clearInterval(timer);
					statusEl.textContent = 'Paused';
					pauseBtn.textContent = 'Resume';
				} else {
					statusEl.textContent = 'Good luck!';
					pauseBtn.textContent = 'Pause';
					timer = setInterval(tick, 115);
				}
			});
			document.addEventListener('keydown', event => {
				if (keyDirections[event.key]) { event.preventDefault(); setDirection(keyDirections[event.key]); }
				if (event.code === 'Space') { event.preventDefault(); if (!running) startGame(); else pauseBtn.click(); }
			});
			document.querySelectorAll('.pad button').forEach(button => button.addEventListener('click', () => setDirection(button.dataset.dir)));
			let touchStart = null;
			canvas.addEventListener('pointerdown', event => { touchStart = { x: event.clientX, y: event.clientY }; });
			canvas.addEventListener('pointerup', event => {
				if (!touchStart) return;
				const dx = event.clientX - touchStart.x;
				const dy = event.clientY - touchStart.y;
				if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) setDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
				touchStart = null;
			});
			reset();
		})();
	</script>
</body>
</html>
