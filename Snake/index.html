<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Snake</title>
	<style>
		:root { color-scheme: dark; font-family: system-ui, sans-serif; }
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; background: #101714; color: #e8f4ec; }
		main { width: min(100%, 520px); text-align: center; }
		h1 { margin: 0 0 8px; color: #a6f28e; letter-spacing: .12em; }
		.topbar { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; color: #c4d5ca; }
		.score { font-weight: 700; font-size: 1.1rem; }
		canvas { display: block; width: 100%; aspect-ratio: 1; background: #17231c; border: 2px solid #49634e; border-radius: 8px; touch-action: none; }
		.controls { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
		button { border: 1px solid #628368; border-radius: 8px; padding: 10px 18px; background: #25372a; color: #eff8f0; font: inherit; cursor: pointer; }
		button:hover { background: #344b38; }
		.hint { margin: 12px 0 0; color: #aab9ae; font-size: .9rem; }
		.pad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 42px); gap: 5px; justify-content: center; margin-top: 14px; }
		.pad button { padding: 4px; font-size: 1.15rem; }
		.pad .up { grid-column: 2; }
		.pad .left { grid-column: 1; grid-row: 2; }
		.pad .down { grid-column: 2; grid-row: 2; }
		.pad .right { grid-column: 3; grid-row: 2; }
		@media (min-width: 600px) { .pad { display: none; } }
	</style>
</head>
<body>
	<main>
		<h1>SNAKE</h1>
		<div class="topbar"><span id="status">Press Start to play</span><span class="score">Score: <span id="score">0</span></span></div>
		<canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
		<div class="controls">
			<button id="start">Start</button>
			<button id="pause" disabled>Pause</button>
		</div>
		<div class="pad" aria-label="Touch controls">
			<button class="up" data-dir="up" aria-label="Up">▲</button>
			<button class="left" data-dir="left" aria-label="Left">◀</button>
			<button class="down" data-dir="down" aria-label="Down">▼</button>
			<button class="right" data-dir="right" aria-label="Right">▶</button>
		</div>
		<p class="hint">Use arrow keys or WASD to move. Eat the red squares and don't hit the walls or yourself.</p>
	</main>
	<script>
		(() => {
			const canvas = document.getElementById('board');
			const ctx = canvas.getContext('2d');
			const scoreEl = document.getElementById('score');
			const statusEl = document.getElementById('status');
			const startBtn = document.getElementById('start');
			const pauseBtn = document.getElementById('pause');
			const cells = 20;
			const size = canvas.width / cells;
			let snake, food, direction, nextDirection, score, timer, running = false, paused = false;

			function reset() {
				snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
				direction = { x: 1, y: 0 };
				nextDirection = { ...direction };
				score = 0;
				scoreEl.textContent = score;
				placeFood();
				draw();
			}

			function placeFood() {
				do {
					food = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
				} while (snake.some(part => part.x === food.x && part.y === food.y));
			}

			function draw() {
				ctx.fillStyle = '#17231c';
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				ctx.strokeStyle = '#223328';
				ctx.lineWidth = 1;
				for (let i = 1; i < cells; i++) {
					ctx.beginPath(); ctx.moveTo(i * size, 0); ctx.lineTo(i * size, canvas.height); ctx.stroke();
					ctx.beginPath(); ctx.moveTo(0, i * size); ctx.lineTo(canvas.width, i * size); ctx.stroke();
				}
				ctx.fillStyle = '#ff625d';
				ctx.beginPath();
				ctx.arc((food.x + .5) * size, (food.y + .5) * size, size * .34, 0, Math.PI * 2);
				ctx.fill();
				snake.forEach((part, index) => {
					ctx.fillStyle = index === 0 ? '#b5f58c' : '#6fca69';
					ctx.beginPath();
					ctx.roundRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4, 4);
					ctx.fill();
				});
			}

			function tick() {
				direction = nextDirection;
				const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
				const ate = head.x === food.x && head.y === food.y;
				const body = ate ? snake : snake.slice(0, -1);
				if (head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells || body.some(part => part.x === head.x && part.y === head.y)) {
					endGame();
					return;
				}
				snake.unshift(head);
				if (ate) {
					score += 10;
					scoreEl.textContent = score;
					placeFood();
				} else snake.pop();
				draw();
			}

			function endGame() {
				clearInterval(timer);
				running = false;
				paused = false;
				statusEl.textContent = `Game over — score ${score}`;
				startBtn.textContent = 'Play again';
				pauseBtn.disabled = true;
			}

			function startGame() {
				clearInterval(timer);
				reset();
				running = true;
				paused = false;
				statusEl.textContent = 'Good luck!';
				startBtn.textContent = 'Restart';
				pauseBtn.disabled = false;
				pauseBtn.textContent = 'Pause';
				timer = setInterval(tick, 115);
			}

			function setDirection(name) {
				const dirs = {
					up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
					left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
				};
				const candidate = dirs[name];
				if (candidate && (candidate.x !== -direction.x || candidate.y !== -direction.y)) nextDirection = candidate;
			}

			startBtn.addEventListener('click', startGame);
			pauseBtn.addEventListener('click', () => {
				if (!running) return;
				paused = !paused;
				if (paused) {
					clearInterval(timer);
					statusEl.textContent = 'Paused';
					pauseBtn.textContent = 'Resume';
				} else {
					statusEl.textContent = 'Good luck!';
					pauseBtn.textContent = 'Pause';
					timer = setInterval(tick, 115);
				}
			});
			document.addEventListener('keydown', event => {
				const keys = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
				if (keys[event.key]) { event.preventDefault(); setDirection(keys[event.key]); }
				if (event.code === 'Space') { event.preventDefault(); if (!running) startGame(); else pauseBtn.click(); }
			});
			document.querySelectorAll('.pad button').forEach(button => button.addEventListener('click', () => setDirection(button.dataset.dir)));
			let touchStart = null;
			canvas.addEventListener('pointerdown', event => { touchStart = { x: event.clientX, y: event.clientY }; });
			canvas.addEventListener('pointerup', event => {
				if (!touchStart) return;
				const dx = event.clientX - touchStart.x;
				const dy = event.clientY - touchStart.y;
				if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) setDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
				touchStart = null;
			});
			reset();
		})();
	</script>
</body>
</html>
